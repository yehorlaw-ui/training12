<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>12 недель</title><meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0c10;--sf:#12161c;--ln:#1f2630;--tx:#e9edf3;--mu:#8691a1;--ac:#2f6bff;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(90px + env(safe-area-inset-bottom))}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 12px}h3{font-size:16px;margin:20px 0 8px}
small,.mu{color:var(--mu);font-size:13px}p{margin-top:4px}
button,input,select{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
button{cursor:pointer}button:active{background:var(--ac)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac)}
input,select{width:100%}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hd div{text-align:center;display:grid}.hd button{width:44px}
.card{background:var(--sf);border:1px solid var(--ln);border-left:3px solid var(--ac);border-radius:12px;padding:12px 14px;margin-bottom:12px}.card.dl{border-left-color:#e0a030}.card b{font-size:17px}
.day{border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;background:var(--sf);overflow:hidden}.day.today{border-color:var(--ac)}
.dh{display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:14px;cursor:pointer;align-items:center}.dh span{color:var(--mu)}.dh em{font-style:normal;color:var(--ac);font-weight:700}
.ex{padding:12px 14px;border-top:1px solid var(--ln)}.er{display:flex;justify-content:space-between;gap:10px}.er b{cursor:pointer;font-weight:600}.er span{color:var(--ac);font-weight:700;white-space:nowrap}
.ir{display:grid;grid-template-columns:90px 1fr 82px;gap:8px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1015ee;backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:16px 0;color:var(--mu);font-weight:600}nav button.on{color:var(--tx);box-shadow:inset 0 2px var(--ac)}
details{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mu);font-size:9px}.ax{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row.three{grid-template-columns:1.3fr 1fr 1fr}
.pri{background:var(--ac);border-color:var(--ac);font-weight:600}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
#tm{position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--ac);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}#tm[hidden]{display:none}#tm button{background:none;border:0;padding:0 4px}
</style></head><body><div id="app"></div><div id="tm" hidden><span></span><button data-a="tx" aria-label="Закрыть таймер">✕</button></div>
<script type="module" src="app.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
